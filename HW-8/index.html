<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Анкета відвідувача ресторану</title>
</head>
<body bgcolor="#fbc55d">

 <h1>Анкета відвідувача ресторану</h1>

  <form action="#">
    <fieldset>
        <legend><i>Контактна інформація</i></legend>
        <p>
            <label for="name"><b>Ім'я:</b></label>
            <input type="text" id="name" name="user_name">
        </p>
        <p>
         <label for="phone"><b>Телефон:</b></label>
            <input type="tel" id="phone" name="user_phone" placeholder="у форматі 000-000-00-00">
        </p>
        <p>
            <label for="email"><b>Email:</b></label>
            <input type="email" id="email" name="user_email">
        </p>
        <p>
            <label for="date"><b>Дата відвідування:</b></label>
            <input type="date" id="date" name="visit_date">
        </p>
    </fieldset>

    <fieldset>
        <legend><i>Персональна інформація</i></legend>
        <p>
            <label for="age"><b>Вік:</b></label>
            <input type="number" id="age" name="user_age">
        </p>
        <p>
            <label for="cuisine"><b>Улюблена кухня:</b></label>
            <input type="text" id="cuisine" name="fav_cuisine">
        </p>
        <p>
            <label for="dishes"><b>Які іще страви ви б хотіли бачити в меню?</b></label><br>
            <textarea id="dishes" name="suggested_dishes" rows="5" cols="40"></textarea>
        </p>
    </fieldset>

    <fieldset>
        <legend><i>Оцінка нашого закладу</i></legend>
        <p><b>Чому ви обрали наш заклад?</b></p>
        <p>
            <input type="checkbox" id="work" name="reason" value="work">
            <label for="work">Поряд з місцем роботи</label><br>
            <input type="checkbox" id="ads" name="reason" value="ads">
            <label for="ads">Побачив рекламу</label><br>
            <input type="checkbox" id="friends" name="reason" value="friends">
            <label for="friends">Порадили друзі</label><br>
            <input type="checkbox" id="price" name="reason" value="price">
            <label for="price">Найкраще співвідношення ціни і якості</label>
        </p>

        <p><b>Чи будете ви рекомендувати наш заклад своїм знайомим?</b></p>
        <p>
            <input type="radio" id="yes" name="recommend" value="yes">
            <label for="yes">Так</label><br>
            <input type="radio" id="no" name="recommend" value="no">
            <label for="no">Ні</label>
        </p>
    </fieldset>
    <br>
    <button type="submit">Відправити</button>
  </form>

</body>
</html>
