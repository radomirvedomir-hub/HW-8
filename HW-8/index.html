<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form</title>
</head>
<body>
    <h3>ЗАЛИШТЕ СВОЇ ДАНІ, МИ З ВАМИ
        ЗВ"ЯЖЕМОСЯ</h3>
        <form action="">
            <label>
            Ім'я
            <input type="text" placeholder="Введіть ваше ім'я"/>
            </label>
            <label for ="email">
                Email
                <input type="email" placeholder="Введіть ваш e-mail" />

            </label>
            <label>
                Телефон
                <input type="tel" placeholder="Введіть ваш номер телефону" />
            </label>
            <label>
                Посилання на Facebook, Linkedin, або CV
                <input type="url" placeholder="Введіть посилання" />
            </label>
            <label>
                Прикріпіть файл
                <input type="file" value="Вибрати файл" />
            </label>
            <label>
                Супровідний лист
                <textarea rows="10" cols="35"></textarea>
            </label>
            <button type="submit">Надіслати</button>
            <label>
                <input type="checkbox">Надсиланням данної заявки, я підтверджую, що ознайомлений з Політикою конфеденційності, приймаю її умови та згоден з нею, включаючи ті, що стосуются регламентації обробки моїх персональних даних.</label>
        </form>
</body>
</html>
